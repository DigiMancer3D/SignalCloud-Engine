name: Bug report
description: Report a reproducible SignalCloud public-alpha problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach user_data, machine profiles, private paths, tokens, keys, or personal saves."
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution, session, GPU, and driver
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: actual
    attributes:
      label: Actual result and minimal terminal excerpt
    validations:
      required: true
